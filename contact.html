<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - AI Directory</title>
  <meta name="description" content="Contact AIHUB — send us feedback or suggest tools.">
  <meta property="og:title" content="Contact Us - AIHUB">
  <meta property="og:description" content="Contact AIHUB — send us feedback or suggest tools.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v4"></path>
        <line x1="8" y1="16" x2="8" y2="16"></line>
        <line x1="16" y1="16" x2="16" y2="16"></line>
      </svg>
      <span class="logo-text">AI<span>HUB</span></span>
    </div>

    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>

    <nav class="menu">
      <a href="tools.html">Tools</a>
      <a href="favorites.html">Favorites ❤️</a>
      <a href="about.html">About ℹ️</a>
      <a href="contact.html" class="active">Contact 📞</a>
    </nav>
  </header>

  <div class="container">
    <form id="contactForm">
      <h2>Get in Touch</h2>
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your Name">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="Suggest a new tool or ask a question..."></textarea>
      </div>
      <div aria-live="polite" id="formStatus" style="color:var(--muted);"></div>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <script>
    // Menu toggle for mobile
    document.querySelector('.menu-toggle').addEventListener('click', (e) => {
      const menu = document.querySelector('nav.menu');
      const expanded = e.currentTarget.getAttribute('aria-expanded') === 'true';
      e.currentTarget.setAttribute('aria-expanded', String(!expanded));
      if (menu.style.display === 'flex') { menu.style.display = 'none'; } else { menu.style.display = 'flex'; }
    });

    // Contact form handling: keep client-side fallback; show accessible message
    const form = document.getElementById('contactForm');
    const status = document.getElementById('formStatus');
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      // TODO: send to backend via fetch if endpoint provided. For now show accessible message.
      status.textContent = 'Thank you — your message was received.';
      form.reset();
    });
  </script>
</body>
</html>
