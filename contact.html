<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - AI Directory</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header nav a { color: var(--text-muted); text-decoration: none; margin-left: 1.5rem; font-weight: 500; }
    header nav a:hover, header nav a.active { color: var(--primary); }
    .container { max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
    form { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
    label { font-size: 0.9rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <header>
    <h1>📞 Contact Us</h1>
    <nav>
      <a href="tools.html">Tools</a>
      <a href="favorites.html">Favorites ❤️</a>
      <a href="about.html">About ℹ️</a>
      <a href="contact.html" class="active">Contact 📞</a>
    </nav>
  </header>

  <div class="container">
    <form onsubmit="event.preventDefault(); alert('Thank you for reaching out!');">
      <h2>Get in Touch</h2>
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your Name">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" rows="5" required placeholder="Suggest a new tool or ask a question..."></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
