<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools Directory</title>
  <meta name="description" content="Browse AIHUB's directory of AI tools by category. Search, favorite, and explore tools for productivity, design, dev, and more.">
  <meta property="og:title" content="AI Tools Directory - AIHUB">
  <meta property="og:description" content="Browse AI tools, search by category, and save favorites.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/chatgpt.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🤖 AI Directory</h1>
    <nav>
      <a href="tools.html" class="active">Tools</a>
      <a href="favorites.html">Favorites ❤️</a>
      <a href="about.html">About ℹ️</a>
      <a href="contact.html">Contact 📞</a>
    </nav>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search AI tools..." aria-label="Search tools">
      <select id="categorySelect" class="category-select" aria-label="Filter category">
        <option value="All">All Categories</option>
        <option value="Text & Chat">Text & Chat</option>
        <option value="Image Generation">Image Generation</option>
        <option value="Code & Dev">Code & Dev</option>
        <option value="Audio & Voice">Audio & Voice</option>
        <option value="Video & Animation">Video & Animation</option>
        <option value="Productivity">Productivity</option>
      </select>
    </div>

    <div class="grid" id="toolsGrid" aria-live="polite"></div>
  </div>

  <!-- Load centralized tools data -->
  <script src="tools-data.js"></script>

  <script>
    // Use shared TOOLS registry if available
    const tools = window.TOOLS || [];

    let favorites = JSON.parse(localStorage.getItem('ai_favs')) || [];

    function saveFavorites() {
      localStorage.setItem('ai_favs', JSON.stringify(favorites));
    }

    function toggleFavorite(id, button) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
        if (button) button.setAttribute('aria-pressed','false');
      } else {
        favorites.push(id);
        if (button) button.setAttribute('aria-pressed','true');
      }
      saveFavorites();
      renderTools();
    }

    function createFavButton(tool) {
      const btn = document.createElement('button');
      const isFav = favorites.includes(tool.id);
      btn.className = `fav-btn ${isFav ? 'active' : ''}`;
      btn.innerHTML = isFav ? '❤️' : '🤍';
      btn.setAttribute('aria-label', isFav ? `Remove ${tool.name} from favorites` : `Add ${tool.name} to favorites`);
      btn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
      btn.tabIndex = 0;
      btn.addEventListener('click', () => toggleFavorite(tool.id, btn));
      btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFavorite(tool.id, btn); } });
      return btn;
    }

    function renderTools() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const catVal = document.getElementById('categorySelect').value;
      const grid = document.getElementById('toolsGrid');

      grid.innerHTML = '';

      const filtered = tools.filter(tool => {
        const matchesSearch = tool.name.toLowerCase().includes(searchVal) || tool.desc.toLowerCase().includes(searchVal);
        const matchesCategory = catVal === 'All' || tool.category === catVal;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1;">No AI tools match your criteria.</p>`;
        return;
      }

      filtered.forEach(tool => {
        const badgeClass = tool.badge === 'Free' ? 'badge-free' : tool.badge === 'Paid' ? 'badge-paid' : 'badge-freemium';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <h3 class="card-title">${tool.name}</h3>
              <span class="badge ${badgeClass}">${tool.badge}</span>
            </div>
            <p class="card-desc">${tool.desc}</p>
          </div>
          <div class="card-footer">
            <span class="rating">★ ${tool.rating}</span>
          </div>
        `;

        const footer = card.querySelector('.card-footer');
        const favButton = createFavButton(tool);
        footer.appendChild(favButton);

        grid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderTools);
    document.getElementById('categorySelect').addEventListener('change', renderTools);

    // Initial render
    renderTools();
  </script>
</body>
</html>
