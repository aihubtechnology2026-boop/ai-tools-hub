<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Favorites - AI Tools</title>
  <meta name="description" content="Your saved favorite AI tools on AIHUB for quick access.">
  <meta property="og:title" content="Your Favorites - AIHUB">
  <meta property="og:description" content="Saved AI tools you favorited for quick access and management.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/chatgpt.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>❤️ Your Favorites</h1>
    <nav>
      <a href="tools.html">Tools</a>
      <a href="favorites.html" class="active">Favorites ❤️</a>
      <a href="about.html">About ℹ️</a>
      <a href="contact.html">Contact 📞</a>
    </nav>
  </header>

  <div class="container">
    <h2>Bookmarked AI Tools</h2>
    <div class="grid" id="favGrid" aria-live="polite"></div>
  </div>

  <script src="tools-data.js"></script>
  <script>
    const tools = window.TOOLS || [];

    function renderFavorites() {
      const favs = JSON.parse(localStorage.getItem('ai_favs')) || [];
      const grid = document.getElementById('favGrid');
      grid.innerHTML = '';

      const favTools = tools.filter(t => favs.includes(t.id));

      if (favTools.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1;">You haven't added any favorites yet!</p>`;
        return;
      }

      favTools.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <h3 class="card-title">${tool.name}</h3>
            <p class="card-desc">${tool.desc}</p>
          </div>
        `;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = 'Remove';
        removeBtn.setAttribute('aria-label', `Remove ${tool.name} from favorites`);
        removeBtn.addEventListener('click', () => {
          let current = JSON.parse(localStorage.getItem('ai_favs')) || [];
          current = current.filter(id => id !== tool.id);
          localStorage.setItem('ai_favs', JSON.stringify(current));
          renderFavorites();
        });

        card.appendChild(removeBtn);
        grid.appendChild(card);
      });
    }

    // Initial render
    renderFavorites();
  </script>
</body>
</html>
