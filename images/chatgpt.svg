  <g transform="translate(300,60)" fill="#e6eef8" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" font-size="42" font-weight="700">AIHUB</text>
    <text x="0" y="46" font-size="18" fill="#94a3b8">Handpicked AI tools, tutorials & resources</text>
