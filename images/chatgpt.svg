    <rect x="0" y="120" width="220" height="120" rx="18" fill="#0b2030" stroke="#00c6ff"/>
    <circle cx="110" cy="40" r="40" fill="#0b2030" stroke="#00c6ff"/>
    <rect x="80" y="52" width="60" height="8" rx="4" fill="#00c6ff"/>
